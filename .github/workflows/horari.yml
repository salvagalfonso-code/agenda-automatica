name: Tasca 00 Artistes

on:
  schedule:
    - cron: '15 0,1,3,5,6,7,9,10,11,13,14,15,17,18,19,21,22,23 * * *'
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-genai duckduckgo-search pytz
      - name: Crear fitxer de credencials
        env:
          CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$CREDS" > credentials.json
      - name: Executar el bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
